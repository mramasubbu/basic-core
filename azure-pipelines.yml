trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  artifactName: 'drop'

stages:

# ============================================================
# CI STAGE
# ============================================================

- stage: CI
  displayName: 'CI - Build, Test and Publish'

  jobs:

  - job: Build
    displayName: 'Build and Test'

    steps:

    # --------------------------------------------------------
    # Install .NET 10
    # --------------------------------------------------------

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    # --------------------------------------------------------
    # Restore
    # --------------------------------------------------------

    - script: dotnet restore
      displayName: 'Restore'

    # --------------------------------------------------------
    # Build
    # --------------------------------------------------------

    - script: dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: 'Build'

    # --------------------------------------------------------
    # Test
    # --------------------------------------------------------

    - script: dotnet test --configuration $(buildConfiguration) --no-build --verbosity normal
      displayName: 'Test'

    # --------------------------------------------------------
    # Publish
    # --------------------------------------------------------

    - script: dotnet publish --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)
      displayName: 'Publish'

    # --------------------------------------------------------
    # Publish Pipeline Artifact
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Pipeline Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: '$(artifactName)'


# ============================================================
# CD STAGE
# ============================================================

- stage: CD
  displayName: 'CD - Deploy to Azure App Service'

  dependsOn: CI

  condition: succeeded()

  jobs:

  - deployment: Deploy
    displayName: 'Deploy to Azure'

    environment: 'production'

    strategy:
      runOnce:

        deploy:

          steps:

          # --------------------------------------------------
          # Download Artifact
          # --------------------------------------------------

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Pipeline Artifact'
            inputs:
              artifact: '$(artifactName)'
              path: '$(Pipeline.Workspace)/$(artifactName)'

          # --------------------------------------------------
          # Deploy to Azure App Service
          # --------------------------------------------------

          - task: AzureWebApp@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: 'Azure-Ecommerce-Connection'
              appType: 'webAppLinux'
              appName: 'e-commerce-api'
              package: '$(Pipeline.Workspace)/$(artifactName)'