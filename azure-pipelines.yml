trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'
  imageName: 'my-api'
  containerRegistry: 'YOUR_ACR_NAME.azurecr.io'

stages:

- stage: Build
  displayName: Build and Push Docker image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: Docker@2
      displayName: Build and push image
      inputs:
        command: buildAndPush
        repository: '$(imageName)'
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        containerRegistry: 'YOUR-ACR-SERVICE-CONNECTION'
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Azure App Service
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: Deploy
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: AzureWebAppContainer@1
      displayName: Deploy Docker image to Azure App Service
      inputs:
        azureSubscription: 'AzureFreeSubscription'
        appName: 'myapi-ramasubbu'
        containers: |
          YOUR_ACR_NAME.azurecr.io/my-api:$(tag)
